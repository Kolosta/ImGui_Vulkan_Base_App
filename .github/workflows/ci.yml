name: CI

# ── Triggers (GitFlow) ────────────────────────────────────────────────────────
# • workflow_dispatch        : manual run from ANY branch (Actions tab)
# • push → main, develop     : guards commits landing on the two long-lived
#                              branches (releases on main, integration on develop)
# • pull_request → main, develop, release/**, hotfix/**
#                              : every PR into a protected / integration branch,
#                              plus release-stabilisation and hotfix PRs, must
#                              pass before it can be merged
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Do not override the JavaScript runtime globally: each pinned action selects
# the Node version it supports, and a forced runtime can break third-party
# actions that have not migrated yet.

jobs:
  build:
    name: Build (Windows · MinGW64)
    runs-on: windows-latest

    defaults:
      run:
        # Run every step inside the MSYS2 mingw64 shell so gcc/g++/cmake/
        # ninja are all on PATH and ABI-consistent with the Rust
        # x86_64-pc-windows-gnu target.
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Rust (gnu target, ABI-matching MinGW) ────────────────────────────
      # Installed first so it is on the Windows PATH ($GITHUB_PATH) before
      # the MSYS2 shell is set up with `path-type: inherit` below.
      - name: Setup Rust (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # ── MSYS2 toolchain (GCC + CMake + Ninja) ────────────────────────────
      # path-type: inherit makes the MSYS2 shell inherit the full Windows
      # PATH, so `cargo` (installed by rust-toolchain) is reachable from
      # the same shell that runs cmake/ninja.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-freetype
            git

      # ── Vulkan SDK (headers + loader for find_package(Vulkan)) ───────────
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      # ── Caches ───────────────────────────────────────────────────────────
      - name: Cache CMake FetchContent (_deps)
        uses: actions/cache@v6
        with:
          path: out/build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # rust-toolchain uses the default cargo home (USERPROFILE\.cargo on
      # Windows runners). Cache its registry/git plus the project's
      # cargo build dir for resvg-bindings.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            out/build/ci/src/VectorGraphics/resvg-lib
          key: cargo-${{ runner.os }}-${{ hashFiles('src/tools/resvg-bindings/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # ── Configure ────────────────────────────────────────────────────────
      # With path-type: inherit the MSYS2 shell already has cargo on PATH
      # (installed by rust-toolchain on the Windows side).
      - name: Configure (CMake preset 'ci')
        run: |
          cargo --version
          cmake --version
          cmake --preset ci

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: |
          cmake --build --preset ci -j

      # ── Smoke check: required build outputs must exist ───────────────────
      - name: Smoke check
        run: |
          set -e
          EXE="out/build/ci/Carto.exe"
          ICON="out/build/ci/src/VectorGraphics/generated/IconData.h"
          DLL="out/build/ci/resvg_c.dll"
          fail=0
          for f in "$EXE" "$ICON" "$DLL"; do
            if [ -f "$f" ]; then
              echo "OK   $f"
            else
              echo "MISS $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Build produced an incomplete output set"
            exit 1
          fi

      # ── Artifact (debugging / manual download) ───────────────────────────
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: carto-windows-mingw64
          path: |
            out/build/ci/Carto.exe
            out/build/ci/*.dll
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build and smoke test (Linux · GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libfreetype6-dev libvulkan-dev vulkan-tools glslc \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev libudev-dev mesa-vulkan-drivers xvfb xauth

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci -j2

      - name: Test
        run: ctest --test-dir out/build/ci --output-on-failure

      - name: Smoke check
        run: |
          set -e
          test -x out/build/ci/Carto
          test -f out/build/ci/src/VectorGraphics/generated/IconData.h
          test -f out/build/ci/src/VectorGraphics/resvg-lib/cargo/release/libresvg_c.so
          ldd out/build/ci/Carto | tee /tmp/carto-ldd.txt
          ! grep -q "not found" /tmp/carto-ldd.txt

          for lvp_icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            test -f "$lvp_icd" && break
          done
          test -f "$lvp_icd"

          set +e
          timeout 10s xvfb-run -a env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            VK_DRIVER_FILES="$lvp_icd" \
            XDG_RUNTIME_DIR=/tmp \
            ./out/build/ci/Carto
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "::error::Carto exited unexpectedly during the Linux smoke test (status $status)"
            exit 1
          fi
