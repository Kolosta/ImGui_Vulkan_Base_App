name: CI

# ── Triggers ──────────────────────────────────────────────────────────────────
# • workflow_dispatch : manual run from ANY branch (Actions tab → Run workflow)
# • pull_request → main : every PR targeting main must pass this
# • push → main          : guards direct/merge commits landing on main
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows · MinGW64)
    runs-on: windows-latest

    # Pin CARGO_HOME up-front so it is identical across every context:
    # the Windows-side cache action and the MSYS2 shell (via cygpath).
    # dtolnay/rust-toolchain honours a pre-set CARGO_HOME.
    env:
      CARGO_HOME: ${{ github.workspace }}\.cargo

    defaults:
      run:
        # Run every step inside the MSYS2 mingw64 shell so gcc/g++/cmake/
        # mingw32-make are all on PATH and ABI-consistent with the Rust
        # x86_64-pc-windows-gnu target.
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── MSYS2 toolchain (GCC + CMake + Make) ─────────────────────────────
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            git

      # ── Rust (gnu target, ABI-matching MinGW) ────────────────────────────
      # Installed on the Windows side; the resvg-bindings build invokes
      # `cargo` which CMake finds via PATH. setup-msys2 prepends MSYS to
      # PATH, so we expose cargo explicitly in the build step.
      - name: Setup Rust (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # ── Vulkan SDK (headers + loader for find_package(Vulkan)) ───────────
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      # ── Caches ───────────────────────────────────────────────────────────
      - name: Cache CMake FetchContent (_deps)
        uses: actions/cache@v4
        with:
          path: out/build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # CARGO_HOME is pinned at job level (Windows path under the
      # workspace), so this cache key is stable and matches what the
      # MSYS2 build step resolves via cygpath.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            out/build/ci/src/VectorGraphics/resvg-lib
          key: cargo-${{ runner.os }}-${{ hashFiles('src/tools/resvg-bindings/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # ── Configure ────────────────────────────────────────────────────────
      # rust-toolchain installs cargo under a Windows path ($CARGO_HOME,
      # e.g. C:\Users\runneradmin\.cargo). Convert it to an MSYS2 POSIX
      # path with cygpath so `cargo` is found inside the msys2 shell.
      - name: Configure (CMake preset 'ci')
        run: |
          export PATH="$(cygpath -u "$CARGO_HOME")/bin:$PATH"
          cargo --version
          cmake --version
          cmake --preset ci

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: |
          export PATH="$(cygpath -u "$CARGO_HOME")/bin:$PATH"
          cmake --build --preset ci -j

      # ── Smoke check: required build outputs must exist ───────────────────
      - name: Smoke check
        run: |
          set -e
          EXE="out/build/ci/Carto.exe"
          ICON="out/build/ci/src/VectorGraphics/generated/IconData.h"
          DLL="out/build/ci/resvg_c.dll"
          fail=0
          for f in "$EXE" "$ICON" "$DLL"; do
            if [ -f "$f" ]; then
              echo "OK   $f"
            else
              echo "MISS $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Build produced an incomplete output set"
            exit 1
          fi

      # ── Artifact (debugging / manual download) ───────────────────────────
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: carto-windows-mingw64
          path: |
            out/build/ci/Carto.exe
            out/build/ci/*.dll
          if-no-files-found: error
          retention-days: 14
